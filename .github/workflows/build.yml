name: Build exe

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - with:
          python-version: "3.12"
      - run: pip install pyinstaller requests openai python-dotenv
      - run: pyinstaller --onefile devbuddy.py
      - uses: actions/upload-artifact@v3
        with:
          name: devbuddy-exe
          path: dist/devbuddy.exe