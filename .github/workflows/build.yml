
name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller requests openai python-dotenv

      - run: pyinstaller --onefile devbuddy.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devbuddy-exe
          path: dist/devbuddy.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/devbuddy.exe
          generate_release_notes: true
